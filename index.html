html{scroll-behavior:smooth;}
body{font-family:Georgia,"Noto Serif",serif;background:var(--paper);color:var(--ink);padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden;}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
.wrap{max-width:900px;margin:0 auto;position:relative;}
.view.active{display:block;}

.topbar{position:sticky;top:0;z-index:60;background:#fff;display:flex;flex-direction:column;align-items:center;padding:12px 14px;border-bottom:1px solid #eee;gap:8px;text-align:center;}
.topbar .brand{font-size:16px;font-weight:bold;letter-spacing:.5px;color:var(--maroon);cursor:pointer;}
.navlinks{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;font-family:Arial,sans-serif;font-size:12px;color:#4a3a30;}
.navlinks a{font-weight:bold;cursor:pointer;white-space:nowrap;}

.hero{position:relative;height:60vh;min-height:400px;max-height:560px;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2));}
.hero-slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s ease;}
.hero-slide.active{opacity:1;}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.25) 0%,rgba(0,0,0,.05) 35%,rgba(10,4,5,.92) 100%);}
.hero-content{position:absolute;left:0;right:0;bottom:0;padding:26px 22px;color:#fff;text-align:center;z-index:2;}
.hero-content h1{font-size:28px;line-height:1.2;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.5);}
.hero-content .tagline{margin-top:7px;font-size:14px;opacity:.9;font-family:Arial,sans-serif;font-style:italic;}
.hero-cta{display:flex;justify-content:center;gap:10px;margin-top:16px;}
.hero-cta a{font-family:Arial,sans-serif;font-size:13px;font-weight:bold;padding:11px 18px;border-radius:4px;}
.hero-cta .wa{background:var(--wa);color:#fff;}
.hero-cta .ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);}

.rating-block{text-align:center;padding:22px 20px 6px;}
.rating-num{font-size:26px;color:var(--maroon);font-weight:bold;}
.rating-hearts{color:var(--maroon);font-size:18px;letter-spacing:3px;margin:4px 0;}
.rating-sub{font-family:Arial,sans-serif;font-size:12px;color:#8a7a6c;text-decoration:underline;}

.section{padding:30px 20px 8px;}
.section-head{text-align:center;margin-bottom:20px;}
.section-head .eyebrow{font-family:Arial,sans-serif;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);font-weight:bold;}
.section-head h2{font-size:24px;margin-top:5px;font-style:italic;}
.section-head p{font-family:Arial,sans-serif;font-size:13px;color:#6b5a4e;margin-top:4px;}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.item-card{background:#fff;border-radius:3px;overflow:hidden;box-shadow:0 2px 10px rgba(40,20,10,.08);display:flex;flex-direction:column;}
.item-card.hidden{display:none;}
.item-photo{width:100%;aspect-ratio:2/3;min-height:300px;background-size:cover;background-position:top center;position:relative;}
.item-badge{position:absolute;top:8px;left:8px;background:var(--maroon);color:#fff;font-size:9px;font-family:Arial,sans-serif;font-weight:bold;padding:3px 7px;border-radius:3px;text-transform:uppercase;}
.heart-ic{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:13px;color:#c04;}
.item-body{padding:11px 12px;display:flex;flex-direction:column;flex:1;font-family:Arial,sans-serif;}
.item-title{font-size:13px;color:#4a3a30;line-height:1.3;}
.item-price{font-size:14px;font-weight:bold;color:var(--ink);margin-top:5px;}
.item-price span{font-size:10px;color:#8a7a6c;font-weight:normal;}
.shop-now{margin-top:9px;text-align:center;border:1px solid var(--maroon);color:var(--maroon);font-size:11px;font-weight:bold;padding:7px;border-radius:3px;}
.item-wa{margin-top:7px;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--wa);color:#fff;font-size:11px;font-weight:bold;padding:8px;border-radius:3px;}
.item-wa svg{width:12px;height:12px;fill:#fff;}
.view-more{display:block;width:100%;text-align:center;margin:18px auto 4px;font-family:Arial,sans-serif;font-size:13px;font-weight:bold;color:var(--maroon);background:none;border:1.5px solid var(--maroon);border-radius:999px;padding:11px;cursor:pointer;}

.cats-wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 10px;}
.cat-card{text-align:center;font-family:Arial,sans-serif;background:none;border:none;cursor:pointer;}
.cat-card .circle{width:68px;height:68px;border-radius:50%;background-size:cover;background-position:top center;border:2px solid var(--accent);margin:0 auto 7px;}
.cat-card span{font-size:10.5px;color:#4a3a30;font-weight:bold;line-height:1.2;display:block;}

.arch-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;}

.trust-chip div{font-size:10px;opacity:.75;margin-top:2px;}

.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;padding:0 20px;margin-bottom:6px;}
.gallery img{width:100%;height:100%;object-fit:cover;border-radius:6px;}
.gallery .big{grid-row:span 2;height:100%;}
.gallery div{height:165px;overflow:hidden;border-radius:6px;}

.reviews-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
.review-card{background:var(--cream);border:1px solid rgba(0,0,0,.06);border-radius:8px;padding:16px;}
.review-stars{color:var(--accent);font-size:13px;letter-spacing:2px;margin-bottom:6px;}

.review-author{font-family:Arial,sans-serif;font-size:12px;font-weight:bold;color:var(--maroon);}
.faq-wrap{font-family:Arial,sans-serif;}
.faq-item{border-bottom:1px solid #eee;padding:14px 4px;cursor:pointer;}
.faq-q{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:bold;color:#4a3a30;}
.faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease;font-size:12.5px;color:#6b5a4e;line-height:1.5;}
.faq-item.open .faq-a{max-height:120px;padding-top:8px;}

.visit-block{margin:28px 20px;background:var(--cream);border-radius:10px;padding:22px;}

.popular{border-top:1px solid rgba(255,255,255,.1);padding-top:16px;line-height:2;}

.theme-switch button{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.6);cursor:pointer;padding:0;}

function itemCard(it,extraClass){
  return `<div class="item-card${extraClass||''}">
    <div class="item-photo" style="background-image:url('${it.photo}')"><span class="item-badge">${it.badge}</span><span class="heart-ic">♡</span></div>
    <div class="item-body">
      <div class="item-title">${it.title}</div>
      <div class="item-price">${it.price} <span>per saree</span></div>
      <a class="shop-now" href="${waLink(`Hi, I'm interested in the ${it.title} (${it.price}) — can you send more photos and confirm availability?`)}" target="_blank" rel="noopener">Shop Now</a>
    </div>
  </div>`;
}

function categoryView(cat){
  const shown=cat.items.slice(0,5).map((it,i)=>itemCard(it, i>=4?' hidden':'')).join("");
  return `
  ${navHtml}
  <div class="back-row"><button class="back-btn" onclick="goHome()">← Back to Home</button></div>
  <div class="cat-hero" style="background-image:url('${cat.photo}')"><h2>${cat.name}</h2></div>
  <div class="section">
    <div class="section-head"><div class="eyebrow">Category</div><h2>${cat.name} Collection</h2><p>${cat.items.length} pieces in stock · tap to ask on WhatsApp.</p></div>
    <div class="grid" id="catGrid">${shown}</div>
    ${cat.items.length>4?'<button class="view-more" id="catMoreBtn" onclick="showAllCategory()">View Full Category ↓</button>':''}
  </div>
  <div class="visit-block">
    <h3>Visit the Shop</h3>
    <div class="visit-row">📍 ${SHOP_CONFIG.address}, ${SHOP_CONFIG.city}</div>
    <div class="call-line">
      <a class="tel" href="tel:+${SHOP_CONFIG.whatsappNumber}">☎ Call Now</a>
      <a class="wa" href="${waLink(`Hi, I want to see more from your ${cat.name} collection.`)}" target="_blank" rel="noopener">WhatsApp Us</a>
    </div>
  </div>
  <div class="foot"><div class="foot-logo"><span class="logo-text" style="color:#fff;font-size:15px;font-weight:bold">${SHOP_CONFIG.shopName}</span></div><div class="copyright">© 2026 ${SHOP_CONFIG.shopName}.</div></div>
  `;
}

const app=document.getElementById("app");
function render(){app.innerHTML=homeView;attachHome();}
function attachHome(){
  let si=0;const slides=document.querySelectorAll(".hero-slide");
  if(window._slideTimer)clearInterval(window._slideTimer);
  if(slides.length>1){window._slideTimer=setInterval(()=>{slides[si].classList.remove("active");si=(si+1)%slides.length;slides[si].classList.add("active");},4000);}
}
function showAllWeekly(){document.querySelectorAll("#weeklyGrid .item-card.hidden").forEach(el=>el.classList.remove("hidden"));document.getElementById("weeklyMoreBtn").style.display="none";}
function showAllCategory(){document.querySelectorAll("#catGrid .item-card.hidden").forEach(el=>el.classList.remove("hidden"));document.getElementById("catMoreBtn").style.display="none";}
function setTheme(t){document.documentElement.setAttribute("data-theme",t);}
function goHome(){location.hash="home";}
function openCategory(slug){location.hash="cat-"+slug;}
function toggleFaq(i){document.querySelectorAll(".faq-item")[i].classList.toggle("open");}
function router(){
  const hash=location.hash.replace("#","")||"home";
  if(hash.startsWith("cat-")){
    const cat=SHOP_CONFIG.categories.find(c=>c.slug===hash.replace("cat-",""));
    if(cat){app.innerHTML=categoryView(cat);window.scrollTo(0,0);return;}
  }
  if(hash.startsWith("home-")){
    if(!document.getElementById("home-collection"))render();
    const t=document.getElementById(hash);
    if(t)setTimeout(()=>t.scrollIntoView({behavior:"smooth"}),50);
    return;
  }
  render();window.scrollTo(0,0);
}
window.addEventListener("hashchange",router);
router();
</script>
